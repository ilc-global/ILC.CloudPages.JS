name: Feature Request
description: Suggest a new feature or enhancement for cloudpages.js
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Reminder:** Feature requests are prioritized based on impact, available resources, and customer-specific SLAs. Please also discuss with your ILC Technology support contact.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which area would this affect?
      options:
        - Parameter Types (new input type)
        - Table Rendering
        - Export
        - Hooks / Extensibility
        - Settings / Configuration
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What are you trying to do that you can't do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work? Include config examples if possible.
      render: html
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches you've tried
    validations:
      required: false

  - type: input
    id: fishbowl-version
    attributes:
      label: Fishbowl Version
      placeholder: "e.g., 26.1"
    validations:
      required: false
