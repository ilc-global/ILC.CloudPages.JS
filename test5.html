<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fb_path" content="Training:Database">
    <meta name="fb_modules" content="">
    <meta name="fb_title" content="04 Query from File as Table1">
    <title>Database Queries</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>    
    
    <script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.1/css/jquery.dataTables.min.css">
</head>
<body>
    <div class="container-fluid">
        <h1>Database Queries</h1>  
        <p>This time from a file, and rendering it as a table using DataTables.</p>  
        <div class="form-group">
            <button class="btn btn-primary" id="execute">Execute</button>
        </div>
        <hr></hr>
        <div class="form-group">
            <label for="results">Results</label>
            <div id="table_div">
                <table id="results_table" class="display" width="100%"></table>
            </div>
        </div>
    </div>    
</body>
<script>
    $(document).ready(function(){ // ensures JS will run when DOM (doc object model) is fully loaded and ready
        $("#execute").click(function (e){ // attaches a click event handler to element with ID "execute", when clicked, the function "click ()" will be executed
            var sql_query = fb_client.getResourceFileString("sql/03_Query.sql"); // retrieves the contest of SQL query from file name sql/file_name
            console.log(sql_query); // logs retrieved query content to the browser console for debugging 
            var results = fb_client.runQuery(sql_query); // executes the sql query
            var results_obj = JSON.parse(results); // parses results of query, then stores in "results_obj"
            console.log(results_obj); // logs parsed results object to browser console for debugging
            
            $("#results_table").DataTable({ // initializes DataTable for HTML table
                data: results_obj, // specifies data source for DataTable, which is "results_obj" variable 
                columns: [ // defines columns of DataTable - each column definition includes "data" "title" w optional rendering functions
                    {data:'so_num',title:"SO #"}, // data will be taken from so_num
                    {data:'so_totalprice',title:"Total Price", render: $.fn.dataTable.render.number(',','.',2,'$ ') }, // data is taken from so_totalprice, but w rendering to format data
                    {data:'so_totaltax',title:"Total Tax",  render: $.fn.dataTable.render.number(',','.',2,'$ ') }, // data taken from so_totaltax, w rendering for formatting 
                    {data:'customer_name',title:"Customer Name"}, // data taken from customer_name
                ]
            });
        })
    });
</script>
</html>
