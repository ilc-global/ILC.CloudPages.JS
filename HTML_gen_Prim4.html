<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fb_title" content="HTML Generation Primitives 4 Test">    
    <title>Parameter HTML Generation</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }
       
    </style>
</head>
<body>
    <div id="parametersContainer"></div>

    <script id="parameters" type="application/json">
    {
        "string_01": { "label": "Simple String", "type": "text" },
        "string_02": { "label": "Multi Line String", "type": "multiline" },
        "number_01": { "label": "Whole Numbers", "type": "int" },
        "number_02": { "label": "Percentage", "type": "pct" },
        "number_03": { "label": "Amount", "type": "amt" },
        "datetime_01": { "label": "Date and Time", "type": "timestamp" },
        "datetime_02": { "label": "Date", "type": "date" },
        "datetime_03": { "label": "Time", "type": "time" },
        "boolean_01": {
            "label": "Checkbox", "type": "checkbox",
            "default": true, "true_value": "0",
            "true_label": "Selected", "false_value": "1",
            "false_label": "Disabled"
        }
    }
    </script>

    <script>
    function generateParameterForm() {
        const parameters = JSON.parse(document.getElementById('parameters').textContent);
        const container = document.getElementById('parametersContainer');

        Object.entries(parameters).forEach(([key, { label, type, default: def }]) => {
            const inputElement = document.createElement(type === 'multiline' ? 'textarea' : 'input');
            inputElement.type = (type === 'multiline') ? '' : (type === 'int' || type === 'pct' || type === 'amt') ? 'text' : type;
            inputElement.className = 'form-control';
            inputElement.id = key;
            inputElement.placeholder = label;
            if (type === 'checkbox') inputElement.checked = def || false;

            const labelElement = document.createElement('label');
            labelElement.htmlFor = key;
            labelElement.textContent = label;

            container.appendChild(labelElement);
            container.appendChild(inputElement);
        });
    }

    document.addEventListener('DOMContentLoaded', generateParameterForm);
    </script>
</body>
</html>
