<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fb_title" content="DB Generation Primitives 7">
    <title>Parameter HTML Generation</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
        }
        .form-group label {
            width: 150px;
            margin-right: 10px;
        }
        .error {
            color: red;
            margin-left: 10px;
        }
        .required-asterisk {
            color: red;
            margin-left: 5px;
        }
        .checkbox-container {
            display: flex;
            flex-wrap: wrap;
        }
        .checkbox-container label {
            margin-right: 10px;
            display: block;
        }
        .helper-text {
            font-size: 0.9em;
            margin-top: 5px;
            color: #6c757d; 
            white-space: nowrap;
            position: absolute; 
            display: inline-block; 
            margin-top: 105px; 
            left: 160px; 
            vertical-align: middle;
        }       
        .autocomplete-results {
            position: absolute;
            border: 1px solid #ddd;
            max-height: 150px;
            overflow-y: auto;
            background: white;
            width: 200px;
            z-index: 1000;
            display: none;
        }
        .autocomplete-results div {
            padding: 10px;
            cursor: pointer;
        }
        
    </style>
</head>
<body>
    <div id="parametersContainer"></div>
    <button id="submitButton" class="btn btn-primary">Run</button>
    <div id="submitMessage"></div>

    <script id="parameters" type="application/json">
    {
        "combo_01" : {
            "label" : "Combo Box (Single)",
            "type" : "combobox",
            "mode" : "single",
            "sql" : "select id,name,description from inventorylogtype",
            "value" : "id",
            "display" : "name,description",
            "required" : true
        },
        "combo_02" : {
            "label" : "Combo Box (Multi)",
            "type" : "combobox",
            "mode" : "multi",
            "sql" : "select id,name,description from inventorylogtype",
            "value" : "id",
            "display" : "name,description"
        },
        "combo_03" : {
            "label" : "Combo Box Auto Complete",
            "type" : "autocomplete",
            "mode" : "multi",
            "sql" : "select id,name,description from inventorylogtype",
            "value" : "id",
            "display" : "name,description",
            "search" : "description"
        },    
        "combo_04" : {
            "label" : "Combo Box Auto Complete Lazy",
            "type" : "autocomplete",
            "mode" : "multi",
            "sql" : "select id,name,description from inventorylogtype where name like @input",
            "value" : "id",
            "display" : "name,description",
            "lazy" : true,
            "minChars" : 3
        },        
        "check_01" : {
            "label" : "Checkbox (Single)",
            "type" : "checkbox",
            "mode" : "single",
            "sql" : "select id,name,description from inventorylogtype",
            "value" : "id",
            "display" : "name,description"
        },
        "check_02" : {
            "label" : "Checkbox (Multi)",
            "type" : "checkbox",
            "mode" : "multi",
            "sql" : "select id,name,description from inventorylogtype",
            "value" : "id",
            "display" : "name,description"
        }
    }
    </script>

    <script>
        function createFormGroup(key, parameter) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            const labelElement = document.createElement('label');
            labelElement.textContent = parameter.label;
            if (parameter.required) {
                const asterisk = document.createElement('span');
                asterisk.textContent = '*';
                asterisk.className = 'required-asterisk';
                labelElement.appendChild(asterisk);
            }
            formGroup.appendChild(labelElement);

            let inputElement;
            switch (parameter.type) {
                case 'combobox':
                    inputElement = createComboBox(key, parameter);
                    formGroup.appendChild(inputElement);
                    if (parameter.mode === 'multi') {
                        const helperText = document.createElement('label');
                        helperText.textContent = 'Control-click to multi-select';
                        helperText.className = 'helper-text';
                        formGroup.appendChild(helperText);
                    }
                    break;
                case 'checkbox':
                    inputElement = createCheckBox(key, parameter);
                    formGroup.appendChild(inputElement);
                    break;
                case 'autocomplete':
                    inputElement = createAutocomplete(key, parameter);
                    formGroup.appendChild(inputElement);
                    break;
                default:
                    inputElement = createInputElement(key, 'text');
                    formGroup.appendChild(inputElement);
            }

            const errorElement = document.createElement('span');
            errorElement.className = 'error';
            errorElement.setAttribute('id', key + '_error');
            formGroup.appendChild(errorElement);

            return formGroup;
        }

        function createComboBox(key, parameter) {
            const comboBoxContainer = document.createElement('div');
            comboBoxContainer.className = 'combo-container';
            
            const comboBox = document.createElement('select');
            comboBox.className = 'form-control';
            comboBox.setAttribute('id', key);
            if (parameter.mode === 'multi') {
                comboBox.setAttribute('multiple', 'multiple', 'multiple');
            } else {
                const defaultOption = document.createElement('option');
                defaultOption.textContent = 'Select an option';
                defaultOption.value = '';
                comboBox.appendChild(defaultOption);
            }

            // Simulated data fetching
            const sampleData = [
                { id: 1, name: "Option 1", description: "Description 1" },
                { id: 2, name: "Option 2", description: "Description 2" },
                { id: 3, name: "Lazy Option", description: "Lazy Description" }
            ];

            sampleData.forEach(option => {
                const optionElement = document.createElement('option');
                optionElement.value = option[parameter.value];
                optionElement.textContent = `${option.name}, ${option.description}`;
                comboBox.appendChild(optionElement);
            });

            comboBoxContainer.appendChild(comboBox);

            return comboBoxContainer;
        }

        function createAutocomplete(key, parameter) {
            const autocompleteContainer = document.createElement('div');
            autocompleteContainer.className = 'autocomplete-container';

            const autocompleteInput = document.createElement('input');
            autocompleteInput.setAttribute('type', 'text');
            autocompleteInput.setAttribute('id', key);
            autocompleteInput.className = 'form-control';
            autocompleteInput.setAttribute('placeholder', 'Type to search...');
            autocompleteContainer.appendChild(autocompleteInput);

            const resultsContainer = document.createElement('div');
            resultsContainer.className = 'autocomplete-results';
            autocompleteContainer.appendChild(resultsContainer);

            autocompleteInput.addEventListener('input', function() {
                const inputValue = this.value.toLowerCase();
                if (parameter.lazy && inputValue.length >= parameter.minChars) {
                    performAutocompleteSearch(key, parameter, inputValue);
                } else if (parameter.lazy) {
                    clearAutocompleteResults(resultsContainer);
                } else {
                    performAutocompleteSearch(key, parameter, inputValue);
                }
            });

            return autocompleteContainer;
        }

        function performAutocompleteSearch(key, parameter, inputValue) {
            // Simulate fetching data from server based on inputValue
            const sampleData = [
                { id: 1, name: "Option 1", description: "Description 1" },
                { id: 2, name: "Option 2", description: "Description 2" },
                { id: 3, name: "Lazy Option", description: "Lazy Description" }
            ];

            const filteredData = sampleData.filter(option =>
                option[parameter.display.split(',')[0]].toLowerCase().includes(inputValue)
            );

            const resultsContainer = document.querySelector(`#${key} + .autocomplete-results`);
            resultsContainer.innerHTML = '';

            filteredData.forEach(option => {
                const resultDiv = document.createElement('div');
                resultDiv.textContent = `${option.name}, ${option.description}`;
                resultDiv.addEventListener('click', function() {
                    const inputElement = document.getElementById(key);
                    inputElement.value = `${option.name}, ${option.description}`;
                    resultsContainer.innerHTML = '';
                });
                resultsContainer.appendChild(resultDiv);
            });

            resultsContainer.style.display = filteredData.length > 0 ? 'block' : 'none';
        }

        function clearAutocompleteResults(resultsContainer) {
            resultsContainer.innerHTML = '';
            resultsContainer.style.display = 'none';
        }

        function createCheckBox(key, parameter) {
            const container = document.createElement('div');
            container.className = 'checkbox-container';
            container.id = key;

            // Simulated data fetching
            const sampleData = [
                { id: 1, name: "Option 1", description: "Description 1" },
                { id: 2, name: "Option 2", description: "Description 2" },
                { id: 3, name: "Lazy Option", description: "Lazy Description" }
            ];

            sampleData.forEach(option => {
                const label = document.createElement('label');
                const checkBox = document.createElement('input');
                checkBox.setAttribute('type', 'checkbox');
                checkBox.value = option[parameter.value];
                checkBox.id = `${key}_${option[parameter.value]}`;
                checkBox.name = key;
                
                // For single selection checkbox
                if (parameter.mode === 'single') {
                    checkBox.addEventListener('change', function() {
                        if (this.checked) {
                            const otherCheckboxes = container.querySelectorAll('input[type="checkbox"]');
                            otherCheckboxes.forEach(cb => {
                                if (cb !== this) cb.checked = false;
                            });
                        }
                    });
                }

                label.appendChild(checkBox);
                label.append(option.name);
                container.appendChild(label);
            });

            return container;
        }

        function validateForm() {
            const parameters = JSON.parse(document.getElementById('parameters').textContent);
            let isValid = true;
            for (const key in parameters) {
                const parameter = parameters[key];
                const inputElement = document.getElementById(key);
                const errorElement = document.getElementById(key + '_error');
                if (parameter.required && (!inputElement.value || inputElement.value === '')) {
                    errorElement.textContent = 'This field is required.';
                    isValid = false;
                } else {
                    errorElement.textContent = '';
                }
            }
            return isValid;
        }

        function collectFormData() {
            const parameters = JSON.parse(document.getElementById('parameters').textContent);
            const formData = {};
            for (const key in parameters) {
                const inputElement = document.getElementById(key);
                if (inputElement) {
                    if (parameters[key].type === 'checkbox') {
                        formData[key] = Array.from(document.querySelectorAll(`#${key} input[type="checkbox"]:checked`)).map(checkbox => checkbox.value);
                    } else if (parameters[key].mode === 'multi' && parameters[key].type === 'combobox') {
                        formData[key] = Array.from(inputElement.selectedOptions).map(option => option.value);
                    } else {
                        formData[key] = inputElement.value;
                    }
                }
            }
            return formData;
        }

        document.getElementById('submitButton').addEventListener('click', function () {
            if (validateForm()) {
                const formData = collectFormData();
                console.log(formData); // This will output the JSON object to the console
                document.getElementById('submitMessage').textContent = 'Parameters submitted successfully!';
            } else {
                document.getElementById('submitMessage').textContent = 'Please fill in the required fields.';
            }
        });

        document.addEventListener('DOMContentLoaded', function () {
            const parameters = JSON.parse(document.getElementById('parameters').textContent);
            const parametersContainer = document.getElementById('parametersContainer');

            Object.keys(parameters).forEach(key => {
                const formGroup = createFormGroup(key, parameters[key]);
                parametersContainer.appendChild(formGroup);
            });

            document.addEventListener('click', function(event) {
                // Close all open dropdowns if the click is outside
                const openDropdowns = document.querySelectorAll('.autocomplete-results');
                openDropdowns.forEach(dropdown => {
                    if (!dropdown.contains(event.target) && !event.target.classList.contains('form-control')) {
                        dropdown.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
