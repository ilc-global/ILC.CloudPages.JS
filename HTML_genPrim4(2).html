<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fb_title" content="HTML Generation Primitives pt.2">
    <title>Parameter HTML Generation</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .form-group label {
            width: 150px;
            margin-right: 10px;
        }
        .form-group input[type="checkbox"] {
            width: auto;
            margin-left: 131px;
        }
        .error {
            color: red;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div id="parametersContainer"></div>

    <script id="parameters" type="application/json">
    {
        "string_01": { "label": "Simple String", "type": "text" },
        "string_02": { "label": "Multi Line String", "type": "multiline" },
        "number_01": { "label": "Whole Numbers", "type": "int" },
        "number_02": { "label": "Percentage", "type": "pct" },
        "number_03": { "label": "Amount", "type": "amt" },
        "datetime_01": { "label": "Date and Time", "type": "timestamp" },
        "datetime_02": { "label": "Date", "type": "date" },
        "datetime_03": { "label": "Time", "type": "time" },
        "boolean_01": {
            "label": "Checkbox", "type": "checkbox",
            "default": true, "true_value": "0",
            "true_label": "Selected", "false_value": "1",
            "false_label": "Disabled"
        }
    }
    </script>

    <script>
        // Function to create form group with label, input, and error elements
        function createFormGroup(key, parameter) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            const labelElement = document.createElement('label');
            labelElement.setAttribute('for', key);
            labelElement.textContent = parameter.label;
            formGroup.appendChild(labelElement);

            let inputElement;
            switch (parameter.type) {
                case 'text':
                case 'int':
                case 'pct':
                case 'amt':
                    inputElement = document.createElement('input');
                    inputElement.setAttribute('type', 'text');
                    inputElement.className = 'form-control';
                    break;
                case 'multiline':
                    inputElement = document.createElement('textarea');
                    inputElement.className = 'form-control';
                    break;
                case 'timestamp':
                case 'date':
                case 'time':
                    inputElement = document.createElement('input');
                    inputElement.setAttribute('type', parameter.type);
                    inputElement.className = 'form-control';
                    break;
                case 'checkbox':
                    inputElement = document.createElement('input');
                    inputElement.setAttribute('type', 'checkbox');
                    inputElement.className = 'form-check-input';
                    formGroup.insertBefore(inputElement, labelElement); // Insert checkbox before the label
                    break;
                default:
                    inputElement = document.createElement('input');
                    inputElement.setAttribute('type', 'text');
                    inputElement.className = 'form-control';
            }

            inputElement.setAttribute('id', key);
            inputElement.setAttribute('placeholder', parameter.label);
            formGroup.appendChild(inputElement);

            const errorElement = document.createElement('span');
            errorElement.className = 'error';
            errorElement.setAttribute('id', key + '_error');
            formGroup.appendChild(errorElement);

            return formGroup;
        }

        // Function to generate HTML form elements based on parameter JSON
        function generateParameterForm() {
            const parameters = JSON.parse(document.getElementById('parameters').textContent);
            const container = document.getElementById('parametersContainer');

            Object.keys(parameters).forEach(function(key) {
                const parameter = parameters[key];
                const formGroup = createFormGroup(key, parameter);
                container.appendChild(formGroup);
            });
        }

        // Validation functions
        function validateInt(inputElement, errorElement) {
            if (!/^\d+$/.test(inputElement.value)) {
                errorElement.textContent = 'Invalid whole number';
                return false;
            } else {
                errorElement.textContent = '';
                return true;
            }
        }

        function validatePct(inputElement, errorElement) {
            if (!/^(100|[1-9]?\d)$/.test(inputElement.value)) {
                errorElement.textContent = 'Invalid percentage (0-100)';
                return false;
            } else {
                errorElement.textContent = '';
                return true;
            }
        }

        function validateAmt(inputElement, errorElement) {
            if (!/^\d+(\.\d{1,2})?$/.test(inputElement.value)) {
                errorElement.textContent = 'Invalid amount (e.g., 100.00)';
                return false;
            } else {
                errorElement.textContent = '';
                return true;
            }
        }

        function validateForm() {
            const parameters = JSON.parse(document.getElementById('parameters').textContent);
            let valid = true;

            Object.keys(parameters).forEach(function(key) {
                const parameter = parameters[key];
                const inputElement = document.getElementById(key);
                const errorElement = document.getElementById(key + '_error');

                if (inputElement) {
                    switch (parameter.type) {
                        case 'int':
                            if (!validateInt(inputElement, errorElement)) valid = false;
                            break;
                        case 'pct':
                            if (!validatePct(inputElement, errorElement)) valid = false;
                            break;
                        case 'amt':
                            if (!validateAmt(inputElement, errorElement)) valid = false;
                            break;
                        default:
                            errorElement.textContent = '';
                    }
                }
            });

            return valid;
        }

        // Generate form elements on page load
        document.addEventListener('DOMContentLoaded', function() {
            generateParameterForm();
        });
    </script>
</body>
</html>
