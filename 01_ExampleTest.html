<body>
    <div id="parametersContainer" class="container"></div>
    <button id="submitButton" class="btn btn-primary">Run</button>
    <div id="submitMessage"></div>

    <div id="title"></div>
    <div id="parameters-data"></div>
    <div id="results"></div>
    <div id="footer"></div>
</body>
<script id="settings" type="application/json">
    {
        "load_on_open": false,
        "database_timezone": "UTC-8",
        "amount_unit_format": "$0.00####",
        "amount_total_format": "$0.00",
        "qty_unit_format": "0.00###",
        "qty_total_format": "0",
        "enable_xlsx_export": true,
        "enable_csv_export": true
    }
    </script>
    
    <script id="query" type="text/plain">
    SELECT
        so.num AS so_num,
        so.totalTax AS so_total_tax,
        so.dateIssued AS so_date_issued,
        so.billToZip AS so_billto_zip,
        soitem.productNum AS product_num,
        soitem.qtyFulfilled AS qty_to_fulfill
    FROM so
        JOIN soitem ON soitem.soid = so.id
    WHERE so.customerId {{customer}}
    AND DATE(so.dateIssued) {{date_issued}} 
    LIMIT 100
    </script>
    
    <script id="parameter" type="application/json">
    {
        "child_customers": {
            "type": "multiselect",
            "sql": "select id, name from customer where customer.parentid = 100",
            "value": "id",
            "display": "name"
        },
        "customer": {
            "type": "customer",
            "mode": "single",
            "default": "%"
        },
        "date_issued": {
            "label": "Date Issued",
            "type": "date",
            "mode": "range",
            "valuetype": "timestamp",
            "range_default": "today"
        }
    }
    </script>
