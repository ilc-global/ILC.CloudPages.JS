<script id="query" type="text/plain">
SELECT product.num             AS product_num,
       product.description     AS description,
       SUM(soitem.qtyOrdered)  AS qty,
       SUM(soitem.totalPrice)  AS revenue
       /*cf:select*/
FROM soitem
JOIN so ON so.id = soitem.soId
JOIN product ON product.id = soitem.productId
WHERE so.statusId IN (20, 25, 60)
  AND product.num LIKE CONCAT('%', :product, '%')      /*opt:product*/
  /*cf:where*/
GROUP BY product.num, product.description
         /*cf:group*/
ORDER BY product.num
</script>

  },
  "revenue": {
    "label": "Revenue",
    "format": "currency"
  }
}
</script>
