<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fb_path" content="TBD:PATH">
    <meta name="fb_modules" content="MODULES">
    <meta name="fb_title" content="01ExampleTest">
    <meta name="fb_description" content="DESC">
    <meta name="window_state" content="maximized">
    <title>Example Report</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">

    <!-- jQuery + DataTables -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <!-- ILC Libraries -->
    <script src="../../js/fb.js"></script>
    <script src="../../js/cloudpages.js"></script>
    <link rel="stylesheet" href="../../css/cloudpages.css">
</head>
<body>
    <div class="container mt-3">
        <div id="parametersContainer" class="mb-3"></div>
        <div class="mb-3">
            <button id="submitButton" class="btn btn-primary">Run</button>
            <button id="exportBtn" class="btn btn-secondary">Export</button>
        </div>
        <div id="tableContainer"></div>
    </div>

    <script id="settings" type="application/json">
    {
        "load_on_open": false,
        "database_timezone": "UTC-8",
        "amount_unit_format": "$0.00####",
        "amount_total_format": "$0.00",
        "qty_unit_format": "0.00###",
        "qty_total_format": "0",
        "enable_xlsx_export": true,
        "enable_csv_export": true,
        "page_length": 25
    }
    </script>

    <script id="query" type="text/plain">
    SELECT
        so.num AS so_num,
        so.totalTax AS so_total_tax,
        so.dateIssued AS so_date_issued,
        so.billToZip AS so_billto_zip,
        soitem.productNum AS product_num,
        soitem.qtyFulfilled AS qty_to_fulfill
    FROM so
        JOIN soitem ON soitem.soid = so.id
    WHERE so.customerId = :customer
    AND DATE(so.dateIssued) BETWEEN :date_issued_start AND :date_issued_end
    LIMIT 100
    </script>

    <script id="parameters" type="application/json">
    {
        "child_customers": {
            "label": "Customer Node",
            "type": "autocomplete",
            "sql": "SELECT id, name, description FROM inventorylogtype",
            "value": "id",
            "display": "name,description",
            "minChars": 0,
            "search": "name"
        },
        "customer": {
            "label": "Customer",
            "type": "dropdown",
            "sql": "SELECT so.num AS so_num, so.totalprice AS so_totalprice, so.totaltax AS so_totaltax, customer.name AS customer_name FROM so JOIN customer ON customer.id = so.customerid LIMIT 50",
            "mode": "single",
            "value": "so_num",
            "display": "customer_name,so_totalprice,so_totaltax",
            "search": "customer_name",
            "minChars": 0,
            "default": "%"
        },
        "date_issued": {
            "label": "Date Issued",
            "type": "date",
            "mode": "range"
        }
    }
    </script>

    <script id="columns" type="application/json">
    {
        "so_total_tax": {
            "format": "currency"
        },
        "so_date_issued": {
            "format": "date"
        },
        "qty_to_fulfill": {
            "format": "number"
        }
    }
    </script>
</body>
</html>
