<script id="parameters" type="application/json">

    "mode": "range",

  },
  "status": {
    "label": "Status",
    "type": "dropdown",
    "mode": "multi",
    "options": [
      {
        "value": "20",
        "label": "Issued"
      },
      {
        "value": "25",
        "label": "In Progress"
      },
      {
        "value": "60",
        "label": "Fulfilled"
      }
    ],

  },

    "label": "Product contains",
    "type": "string",
    "demo_column": "product_num"
  }
}
</script>

<script id="query" type="text/plain">
SELECT so.num                AS order_num,
       soitem.soLineItem     AS line_num,
       customer.name         AS customer_name,
       DATE(so.dateIssued)   AS order_date,
       so.statusId           AS status_id,
       product.num           AS product_num,
       product.description   AS description,
       soitem.qtyOrdered     AS qty,
       soitem.unitPrice      AS unit_price,
       soitem.totalPrice     AS total_price
       /*cf:select*/
FROM soitem
JOIN so ON so.id = soitem.soId
JOIN customer ON customer.id = so.customerId
JOIN product ON product.id = soitem.productId
WHERE 1 = 1
  AND so.statusId IN (:status)                         /*opt:status*/
  AND DATE(so.dateIssued) >= :date_range_start         /*opt:date_range_start*/
  AND DATE(so.dateIssued) <= :date_range_end           /*opt:date_range_end*/
  AND product.num LIKE CONCAT('%', :product, '%')      /*opt:product*/
  /*cf:where*/
ORDER BY so.dateIssued DESC, so.num, soitem.soLineItem
</script>

<script id="columns" type="application/json">
{

  }
}
</script>
