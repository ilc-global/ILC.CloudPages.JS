<!-- The three branches are the Receiving Summary query. Each cf marker lists
     the records its branch has. -->
<script id="query" type="text/plain">
SELECT po.num AS order_num,
       'PO' AS order_type,
       10 AS order_type_id,
       vendor.name AS source_name,
       part.num AS part_num,
       part.description AS description,
       ri.qty AS qty,
       uom.code AS uom,
       ri.billedtotalcost AS total_cost,
       ri.billedtotalcost / NULLIF(ri.qty, 0) AS unit_cost,
       ri.landedtotalcost AS landed_cost,
       ri.landedtotalcost - ri.billedtotalcost AS difference,
       DATE(po.dateissued) AS date_issued,
       DATE(ri.datereceived) AS date_received,
       DATE(ri.datebilled) AS bill_date,
       DATE(ri.datereconciled) AS date_reconciled,
       DATE(ri.datelastmodified) AS date_last_changed,
       ri.statusid AS status_id,
       receipt.id AS receipt_id
       /*cf:select po part*/
FROM receiptitem ri
JOIN receipt ON ri.receiptid = receipt.id
JOIN poitem ON ri.poitemid = poitem.id AND ri.ordertypeid = 10
LEFT JOIN po ON poitem.poid = po.id
LEFT JOIN vendor ON po.vendorid = vendor.id
JOIN part ON poitem.partid = part.id
JOIN uom ON ri.uomid = uom.id
WHERE 1 = 1
  AND 10 IN (:order_types) /*opt:order_types*/
  AND ri.statusid IN (:statuses) /*opt:statuses*/
  AND DATE(IF(:date_field = 'issued', po.dateissued, ri.datereceived)) >= :date_range_start /*opt:date_range_start*/
  AND DATE(IF(:date_field = 'issued', po.dateissued, ri.datereceived)) <= :date_range_end /*opt:date_range_end*/
  AND receipt.id = :receipt_id /*opt:receipt_id*/
  /*cf:where po part*/

UNION ALL

SELECT so.num AS order_num,
       'SO' AS order_type,
       20 AS order_type_id,
       customer.name AS source_name,
       part.num AS part_num,
       part.description AS description,
       ri.qty AS qty,
       uom.code AS uom,
       ri.billedtotalcost AS total_cost,
       ri.billedtotalcost / NULLIF(ri.qty, 0) AS unit_cost,
       ri.landedtotalcost AS landed_cost,
       ri.landedtotalcost - ri.billedtotalcost AS difference,
       DATE(so.dateissued) AS date_issued,
       DATE(ri.datereceived) AS date_received,
       DATE(ri.datebilled) AS bill_date,
       DATE(ri.datereconciled) AS date_reconciled,
       DATE(ri.datelastmodified) AS date_last_changed,
       ri.statusid AS status_id,
       receipt.id AS receipt_id
       /*cf:select so part*/
FROM receiptitem ri
JOIN receipt ON ri.receiptid = receipt.id
JOIN soitem ON ri.soitemid = soitem.id AND ri.ordertypeid = 20
LEFT JOIN so ON soitem.soid = so.id
LEFT JOIN customer ON so.customerid = customer.id
LEFT JOIN product ON soitem.productid = product.id
LEFT JOIN part ON product.partid = part.id
JOIN uom ON ri.uomid = uom.id
WHERE 1 = 1
  AND 20 IN (:order_types) /*opt:order_types*/
  AND ri.statusid IN (:statuses) /*opt:statuses*/
  AND DATE(IF(:date_field = 'issued', so.dateissued, ri.datereceived)) >= :date_range_start /*opt:date_range_start*/
  AND DATE(IF(:date_field = 'issued', so.dateissued, ri.datereceived)) <= :date_range_end /*opt:date_range_end*/
  AND receipt.id = :receipt_id /*opt:receipt_id*/
  /*cf:where so part*/

UNION ALL

SELECT xo.num AS order_num,
       'TO' AS order_type,
       40 AS order_type_id,
       xo.shiptoname AS source_name,
       part.num AS part_num,
       part.description AS description,
       ri.qty AS qty,
       uom.code AS uom,
       ri.billedtotalcost AS total_cost,
       ri.billedtotalcost / NULLIF(ri.qty, 0) AS unit_cost,
       ri.landedtotalcost AS landed_cost,
       ri.landedtotalcost - ri.billedtotalcost AS difference,
       DATE(xo.dateissued) AS date_issued,
       DATE(ri.datereceived) AS date_received,
       DATE(ri.datebilled) AS bill_date,
       DATE(ri.datereconciled) AS date_reconciled,
       DATE(ri.datelastmodified) AS date_last_changed,
       ri.statusid AS status_id,
       receipt.id AS receipt_id
       /*cf:select part*/
FROM receiptitem ri
JOIN receipt ON ri.receiptid = receipt.id
JOIN xoitem ON ri.xoitemid = xoitem.id AND ri.ordertypeid = 40
LEFT JOIN xo ON xoitem.xoid = xo.id
LEFT JOIN part ON xoitem.partid = part.id
JOIN uom ON ri.uomid = uom.id
WHERE 1 = 1
  AND 40 IN (:order_types) /*opt:order_types*/
  AND ri.statusid IN (:statuses) /*opt:statuses*/
  AND DATE(IF(:date_field = 'issued', xo.dateissued, ri.datereceived)) >= :date_range_start /*opt:date_range_start*/
  AND DATE(IF(:date_field = 'issued', xo.dateissued, ri.datereceived)) <= :date_range_end /*opt:date_range_end*/
  AND receipt.id = :receipt_id /*opt:receipt_id*/
  /*cf:where part*/

ORDER BY 1, 5, 14
    </script>
