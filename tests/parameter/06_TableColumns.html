<script id="query" type="text/plain">
SELECT

so.id as so_id,
so.num AS so_num,
so.note AS so_note,
so.totalTax AS so_total_tax,
so.dateIssued AS so_date_issued,
so.dateissued AS so_date_issued_date,
so.dateissued AS so_date_issued_time,
so.taxRate AS so_tax_rate,
so.taxRate AS so_tax_rate_pct,
so.billToZip AS so_billto_zip,
soitem.id AS soitem_id,
soitem.productNum AS product_num,
soitem.description AS product_desc,
soitem.unitPrice AS line_price_amt,
soitem.unitPrice AS line_price_total,
soitem.qtyFulfilled AS qty_to_fulfill,
soitem.qtyFulfilled AS qty_to_fulfill_qty

FROM so
    JOIN soitem ON soitem.soid = so.id
    
LIMIT 100		
</script>
