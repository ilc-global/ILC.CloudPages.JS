    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    <script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.1/css/jquery.dataTables.min.css">
</head>
<body>
    <div class="container-fluid">
        <h1>Parameters</h1>  
        <p>Taking parameters in JSON and rendering it as a table using DataTables.</p>  
        <div class="form-group">
            <button class="btn btn-primary" id="execute">Execute</button>
        </div>
        <hr></hr>
        <div class="form-group">
            <label for="results">Results</label>
            <div id="table_div">
                <table id="results_table" class="display" style="width:100%"></table>
            </div>
        </div>
    </div>    
   
</body>
<script>
    $(document).ready(function(){
    $("#execute").click(function (e){
        var parameters = JSON.parse($("#parameters").html())[0];
        console.log(parameters); // Log the parsed parameters
        var columns = [];
        var data = [];

        // Define DataTables columns based on parameter keys
        for (var key in parameters) {
            columns.push({ data: key, title: parameters[key].label });
        }

        // Generate a data object with empty values for each parameter
        var rowData = {};
        for (var key in parameters) {
            rowData[key] = parameters[key].type === "checkbox" ? (parameters[key].default ? parameters[key].true_value : parameters[key].false_value) : "";
        }

        // Push the generated row object to the data array
        data.push(rowData);

        // Initialize DataTable with generated columns and data
        $("#results_table").DataTable({
            data: data,
            columns: columns,
            destroy: true
        });
    });
});
</script> 
<script id="parameters" type="application/json">

</script>
