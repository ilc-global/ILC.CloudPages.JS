<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fb_title" content="HTML Generation Primitives 4">    
    <title>Parameter HTML Generation</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .form-group label {
            width: 150px;
            margin-right: 10px;
        }
        .form-group input[type="checkbox"] {
            width: auto;
            margin-left: 131px;
        }
        .error {
            color: red;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <form id="parameterForm">
        <div id="parametersContainer"></div>
        <!--<button type="submit" class="btn btn-primary">Submit</button> -->
    </form> 

    <script id="parameters" type="application/json">
    {
        "string_01": {
            "label": "Simple String",
            "type": "text",
            "mode": "single"
        },
        "string_02": {
            "label": "Multi Line String",
            "type": "multiline"
        },
        "number_01": {
            "label": "Whole Numbers",
            "type": "int"
        },
        "number_02": {
            "label": "Percentage",
            "type": "pct"
        },
        "number_03": {
            "label": "Amount",
            "type": "amt"
        },
        "datetime_01": {
            "label": "Date and Time",
            "type": "timestamp"
        },
        "datetime_02": {
            "label": "Date",
            "type": "date"
        },
        "datetime_03": {
            "label": "Time",
            "type": "time"
        },
        "boolean_01": {
            "label": "Checkbox",
            "type": "checkbox",
            "default": true,
            "true_value": "0",
            "true_label": "Selected",
            "false_value": "1",
            "false_label": "Disabled"
        }
    }
    </script>

    <script>
    // Function to create input elements based on parameter type
    function createInputElement(key, parameter) {
        let inputElement;
        let errorElement = document.createElement('span');
        errorElement.setAttribute('class', 'error');
        errorElement.setAttribute('id', key + '_error');

        switch (parameter.type) {
            case 'text':
                inputElement = document.createElement('input');
                inputElement.setAttribute('type', 'text');
                inputElement.setAttribute('class', 'form-control');
                break;
            case 'int':
                inputElement = document.createElement('input');
                inputElement.setAttribute('type', 'number');
                inputElement.setAttribute('class', 'form-control');
                inputElement.setAttribute('pattern', '\\d+');
                inputElement.setAttribute('title', 'Please enter a valid whole number');
                break;
            case 'pct':
                inputElement = document.createElement('input');
                inputElement.setAttribute('type', 'number');
                inputElement.setAttribute('class', 'form-control');
                inputElement.setAttribute('min', '0');
                inputElement.setAttribute('max', '100');
                inputElement.setAttribute('title', 'Please enter a valid percentage (0-100)');
                break;
            case 'amt':
                inputElement = document.createElement('input');
                inputElement.setAttribute('type', 'number');
                inputElement.setAttribute('class', 'form-control');
                inputElement.setAttribute('step', '0.01');
                inputElement.setAttribute('title', 'Please enter a valid amount (e.g., 100.00)');
                break;
            case 'multiline':
                inputElement = document.createElement('textarea');
                inputElement.setAttribute('class', 'form-control');
                break;
            case 'timestamp':
            case 'date':
            case 'time':
                inputElement = document.createElement('input');
                inputElement.setAttribute('type', parameter.type);
                inputElement.setAttribute('class', 'form-control');
                break;
            case 'checkbox':
                inputElement = document.createElement('input');
                inputElement.setAttribute('type', 'checkbox');
                inputElement.setAttribute('class', 'form-check-input');
                inputElement.checked = parameter.default;
                break;
            default:
                inputElement = document.createElement('input');
                inputElement.setAttribute('type', 'text');
                inputElement.setAttribute('class', 'form-control');
        }

        inputElement.setAttribute('id', key);
        inputElement.setAttribute('placeholder', parameter.label);

        return { inputElement, errorElement };
    }

    // Function to create form group
    function createFormGroup(key, parameter) {
        let { inputElement, errorElement } = createInputElement(key, parameter);

        let labelElement = document.createElement('label');
        labelElement.setAttribute('for', key);
        labelElement.textContent = parameter.label;

        let formGroup = document.createElement('div');
        formGroup.setAttribute('class', 'form-group');
        formGroup.appendChild(labelElement);
        formGroup.appendChild(inputElement);
        formGroup.appendChild(errorElement);

        return formGroup;
    }

    // Function to generate HTML form elements based on parameter JSON
    function generateParameterForm() {
        let parameters = JSON.parse(document.getElementById('parameters').textContent);
        let container = document.getElementById('parametersContainer');

        Object.keys(parameters).forEach(function(key) {
            let parameter = parameters[key];
            let formGroup = createFormGroup(key, parameter);
            container.appendChild(formGroup);
        });
    }

    // Function to validate form inputs
    function validateForm() {
        let parameters = JSON.parse(document.getElementById('parameters').textContent);
        let valid = true;

        Object.keys(parameters).forEach(function(key) {
            let parameter = parameters[key];
            let inputElement = document.getElementById(key);
            let errorElement = document.getElementById(key + '_error');

            if (inputElement) {
                switch (parameter.type) {
                    case 'int':
                        if (!/^\d+$/.test(inputElement.value)) {
                            errorElement.textContent = 'Invalid whole number';
                            valid = false;
                        } else {
                            errorElement.textContent = '';
                        }
                        break;
                    case 'pct':
                        if (!/^(100|[1-9]?\d)$/.test(inputElement.value)) {
                            errorElement.textContent = 'Invalid percentage (0-100)';
                            valid = false;
                        } else {
                            errorElement.textContent = '';
                        }
                        break;
                    case 'amt':
                        if (!/^\d+(\.\d{1,2})?$/.test(inputElement.value)) {
                            errorElement.textContent = 'Invalid amount (e.g., 100.00)';
                            valid = false;
                        } else {
                            errorElement.textContent = '';
                        }
                        break;
                    default:
                        errorElement.textContent = '';
                }
            }
        });

        return valid;
    }

    // Generate form elements on page load
    document.addEventListener('DOMContentLoaded', function() {
        generateParameterForm();
    });

    // Add event listeners for real-time validation
    document.addEventListener('input', function(event) {
        let target = event.target;
        let key = target.id;
        let errorElement = document.getElementById(key + '_error');

        if (target) {
            let parameter = JSON.parse(document.getElementById('parameters').textContent)[key];
            switch (parameter.type) {
                case 'int':
                    if (!/^\d+$/.test(target.value)) {
                        errorElement.textContent = 'Invalid whole number';
                    } else {
                        errorElement.textContent = '';
                    }
                    break;
                case 'pct':
                    if (!/^(100|[1-9]?\d)$/.test(target.value)) {
                        errorElement.textContent = 'Invalid percentage (0-100)';
                    } else {
                        errorElement.textContent = '';
                    }
                    break;
                case 'amt':
                    if (!/^\d+(\.\d{1,2})?$/.test(target.value)) {
                        errorElement.textContent = 'Invalid amount (e.g., 100.00)';
                    } else {
                        errorElement.textContent = '';
                    }
                    break;
            }
        }
    });

    // Validate form on submit
    document.getElementById('parameterForm').addEventListener('submit', function(event) {
        if (!validateForm()) {
            event.preventDefault();
        }
    });
    </script>
</body>
</html>
