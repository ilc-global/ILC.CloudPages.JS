<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fb_path" content="Training:Database">
    <meta name="fb_modules" content="">
    <meta name="fb_title" content="Open Sales Order Query Test">
    <title>Database Queries</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>    
    <script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.1/css/jquery.dataTables.min.css">
</head>
<body>
    <div class="container">
        <h1>Open Sales Order Query</h1>  
        <p> Retrieve and display open sales orders.</p>  
        <button class="btn btn-primary" id="execute">Execute</button>
        <hr>
        <div id="table_div">
            <table id="results_table" class="display" style="width:100%"></table>
        </div>
    </div>     
</body>
<script>
    $(document).ready(function(){
        $("#execute").click(function (e){
            var sql_query = fb_client.getResourceFileString("../sql/open_sales_order_query.sql");
            console.log(sql_query);
            
            var results = fb_client.runQuery(sql_query);
            var results_obj = JSON.parse(results);
            console.log(results_obj);
            
            $("#results_table").DataTable({
                data: results_obj,
                columns: [
                    { data: 'so_num', title: "Sales Order #" },
                    { data: 'so_date_issued', title: "Date Issued", render: data => new Date(data).toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' }) },
                    { data: 'customer_name', title: "Customer Name" },
                    { data: 'so_shipto_city', title: "Ship To City" },
                    { data: 'so_shipto_state', title: "Ship To State" },
                    { data: 'so_shipto_country', title: "Ship To Country" },
                    { data: 'line_type', title: "Line Type" },
                    { data: 'line_sequence', title: "Line Sequence" },
                    { data: 'line_product_num', title: "Product Number" },
                    { data: 'line_product_desc', title: "Product Description" },
                    { data: 'line_order_qty', title: "Order Quantity" },
                    { data: 'line_picked_qty', title: "Picked Quantity" },
                    { data: 'line_fulfilled_qty', title: "Fulfilled Quantity" },
                    { data: 'line_open_qty', title: "Open Quantity" },
                    { data: 'uom_code', title: "UOM" },
                    { data: 'line_status', title: "Line Status" }
                ]
            });
        });
    });
</script>
</html>
