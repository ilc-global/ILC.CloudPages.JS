<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fb_title" content="HTML Generation Primitives">    
    <title>Parameter HTML Generation</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="parametersContainer"></div>

    <script id="parameters" type="application/json">
    {
        "string_01": {
            "label": "Simple String",
            "type": "text",
            "mode": "single"
        },
        "string_02": {
            "label": "Multi Line String",
            "type": "multiline"
        },
        "number_01": {
            "label": "Whole Numbers",
            "type": "int"
        },
        "number_02": {
            "label": "Percentage",
            "type": "pct"
        },
        "number_03": {
            "label": "Amount",
            "type": "amt"
        },
        "datetime_01": {
            "label": "Date and Time",
            "type": "timestamp"
        },
        "datetime_02": {
            "label": "Date",
            "type": "date"
        },
        "datetime_03": {
            "label": "Time",
            "type": "time"
        },
        "boolean_01": {
            "label": "Checkbox",
            "type": "checkbox",
            "default": true,
            "true_value": "0",
            "true_label": "Selected",
            "false_value": "1",
            "false_label": "Disabled"
        }
    }
    </script>

    <script>
    // Function to generate HTML form elements based on parameter JSON
    function generateParameterForm() {
        var parameters = JSON.parse(document.getElementById('parameters').textContent);
        var container = document.getElementById('parametersContainer');

        Object.keys(parameters).forEach(function(key) {
            var parameter = parameters[key];
            var inputElement;

            switch (parameter.type) {
                case 'text':
                case 'int':
                case 'pct':
                case 'amt':
                    inputElement = document.createElement('input');
                    inputElement.setAttribute('type', 'text');
                    inputElement.setAttribute('class', 'form-control');
                    break;
                case 'multiline':
                    inputElement = document.createElement('textarea');
                    inputElement.setAttribute('class', 'form-control');
                    break;
                case 'timestamp':
                case 'date':
                case 'time':
                    inputElement = document.createElement('input');
                    inputElement.setAttribute('type', parameter.type);
                    inputElement.setAttribute('class', 'form-control');
                    break;
                case 'checkbox':
                    inputElement = document.createElement('input');
                    inputElement.setAttribute('type', 'checkbox');
                    inputElement.setAttribute('class', 'form-check-input');
                    break;
                default:
                    inputElement = document.createElement('input');
                    inputElement.setAttribute('type', 'text');
                    inputElement.setAttribute('class', 'form-control');
            }

            inputElement.setAttribute('id', key);
            inputElement.setAttribute('placeholder', parameter.label);

            var labelElement = document.createElement('label');
            labelElement.setAttribute('for', key);
            labelElement.textContent = parameter.label;

            container.appendChild(labelElement);
            container.appendChild(inputElement);
        });
    }

    // Generate form elements on page load
    document.addEventListener('DOMContentLoaded', function() {
        generateParameterForm();
    });
    </script>
</body>
</html>
