    <script>
        // Helper function to debounce the input
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // Fetch data from the server for a given parameter and store it in the cache
        async function fetchParameterData(param) {
            if (!param.sql) {
                return [];
            }

            // Replace with your server's API endpoint
            const apiUrl = 'YOUR_API_ENDPOINT';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ sql: param.sql })
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching parameter data:', error);
                return [];
            }
        }

        // Helper function to escape special characters in the display text
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Function to create a new parameter row based on the parameter config
        async function createParameterRow(key, param) {
            const container = document.createElement('div');
            container.classList.add('form-group');
            container.id = `group-${key}`;

            const label = document.createElement('label');
            label.innerText = param.label;

            const inputContainer = document.createElement('div');
            inputContainer.classList.add('autocomplete-container');
            const input = document.createElement('input');
            input.type = 'text';
            input.classList.add('form-control');
            input.dataset.key = key;

            const resultsContainer = document.createElement('div');
            resultsContainer.classList.add('autocomplete-results');

            const predictiveText = document.createElement('div');
            predictiveText.classList.add('predictive-text');

            inputContainer.appendChild(input);
            inputContainer.appendChild(predictiveText);
            inputContainer.appendChild(resultsContainer);

            container.appendChild(label);
            container.appendChild(inputContainer);

            // Append the container to the parameters container
            document.getElementById('parametersContainer').appendChild(container);

            const parameterData = await fetchParameterData(param);

            input.addEventListener('input', debounce(async function() {
                const searchTerm = input.value.toLowerCase();
                resultsContainer.innerHTML = '';
                resultsContainer.style.display = 'none';

                if (searchTerm.length > 0) {
                    const searchFields = param.search.split(',').map(field => field.trim());

                    const filteredData = parameterData.filter(item => {
                        return searchFields.some(field => {
                            return item[field] && item[field].toLowerCase().includes(searchTerm);
                        });
                    });

                    const closestMatch = filteredData.length > 0 ? filteredData[0][param.display.split(',')[0].trim()] : '';
                    predictiveText.textContent = closestMatch;
                    predictiveText.style.display = closestMatch ? 'block' : 'none';

                    filteredData.forEach(item => {
                        const displayText = param.display.split(',').map(field => item[field.trim()]).join(' - ');
                        const resultDiv = document.createElement('div');
                        resultDiv.innerHTML = escapeHtml(displayText);
                        resultDiv.addEventListener('click', () => {
                            input.value = displayText;
                            resultsContainer.innerHTML = '';
                            resultsContainer.style.display = 'none';
                            predictiveText.style.display = 'none';
                        });
                        resultsContainer.appendChild(resultDiv);
                    });

                    if (filteredData.length > 0) {
                        resultsContainer.style.display = 'block';
                    }
                }
            }, 300));
        }

        // Function to initialize the form with parameter rows
        async function initializeForm() {
            const parameters = JSON.parse(document.getElementById('parameters').innerHTML);
            for (const key in parameters) {
                await createParameterRow(key, parameters[key]);
            }
        }

        // Function to handle form submission
        async function handleSubmit() {
            const parameters = JSON.parse(document.getElementById('parameters').innerHTML);
            const result = {};

            for (const key in parameters) {
                const input = document.querySelector(`#group-${key} input`);
                if (input) {
                    result[key] = input.value;
                }
            }

            // Replace with your server's API endpoint
            const apiUrl = 'YOUR_API_ENDPOINT';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(result)
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const responseData = await response.json();
                document.getElementById('submitMessage').innerText = responseData.message || 'Success!';
                document.getElementById('submitMessage').classList.remove('error-message');
                document.getElementById('submitMessage').classList.add('success-message');
            } catch (error) {
                console.error('Error submitting form:', error);
                document.getElementById('submitMessage').innerText = 'Error submitting form';
                document.getElementById('submitMessage').classList.remove('success-message');
                document.getElementById('submitMessage').classList.add('error-message');
            }
        }

        // Initialize the form on page load
        window.addEventListener('load', initializeForm);
        document.getElementById('submitButton').addEventListener('click', handleSubmit);
    </script>
