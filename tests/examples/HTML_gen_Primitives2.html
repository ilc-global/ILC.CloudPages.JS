<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fb_title" content="HTML Primitives 2">    
    <title>HTML Generation for Primitives</title>
</head>
<body>
    <div id="parametersContainer"></div>

    <script>
        // Define the primitives as JSON data
        var primitives = {
            "string_01": {
                "label": "Simple String",
                "type": "text",
                "mode": "single"
            },
            "string_02": {
                "label": "Multi Line String",
                "type": "text",
                "mode": "multiline"
            },
            "number_01": {
                "label": "Whole Numbers",
                "type": "int"
            },
            "number_02": {
                "label": "Percentage",
                "type": "pct"
            },
            "number_03": {
                "label": "Amount",
                "type": "amt"
            },
            "datetime_01": {
                "label": "Date and Time",
                "type": "timestamp"
            },
            "datetime_02": {
                "label": "Date",
                "type": "date"
            },
            "datetime_03": {
                "label": "Time",
                "type": "time"
            },
            "boolean_01": {
                "label": "Checkbox",
                "type": "checkbox",
                "default": true,
                "true_value": "0",
                "true_label": "Selected",
                "false_value": "1",
                "false_label": "Disabled"
            }
        };

        // Function to generate HTML code for primitives
        function generateHTMLForPrimitives() {
            var container = document.getElementById('parametersContainer');
            var htmlOutput = '<pre>'; // Start with <pre> tag to display raw HTML

            // Loop through each primitive definition
            Object.keys(primitives).forEach(function (key) {
                var primitive = primitives[key];
                var htmlElement = '';

                switch (primitive.type) {
                    case 'text':
                        htmlElement = '<p>' + primitive.label + ': &lt;input type="text"&gt;</p>';
                        break;
                    case 'int':
                    case 'pct':
                    case 'amt':
                        htmlElement = '<p>' + primitive.label + ': &lt;input type="number"&gt;</p>';
                        break;
                    case 'timestamp':
                    case 'date':
                    case 'time':
                        htmlElement = '<p>' + primitive.label + ': &lt;input type="date"&gt;</p>';
                        break;
                    case 'checkbox':
                        var checkedAttr = primitive.default ? 'checked' : '';
                        htmlElement = '<p>&lt;label&gt;&lt;input type="checkbox" ' + checkedAttr + '&gt; ' + primitive.label + '&lt;/label&gt;</p>';
                        break;
                    default:
                        htmlElement = '<p>' + primitive.label + ': &lt;input type="text"&gt;</p>';
                        break;
                }

                htmlOutput += htmlElement;
            });

            htmlOutput += '</pre>'; // End the <pre> tag

            // Display the generated HTML code
            container.innerHTML = htmlOutput;
        }

        // Generate HTML for primitives on page load
        document.addEventListener('DOMContentLoaded', function () {
            generateHTMLForPrimitives();
        });
    </script>
</body>
</html>
