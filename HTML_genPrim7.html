<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fb_title" content="HTML Generation Primitives 7">
    <title>Parameter HTML Generation</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .form-group label {
            width: 150px;
            margin-right: 10px;
        }
        .form-group .range-divider {
            margin: 0 5px;
        }
        .error {
            color: red;
            margin-left: 10px;
        }
        .required-asterisk {
            color: red;
            margin-left: 5px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .checkbox-container label {
            margin-bottom: 0;
            width: auto;
            margin-right: 10px;
        }
        .checkbox-container input[type="checkbox"] {
            margin-left: 10px;
        }
        #submitMessage {
            color: green;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="parametersContainer"></div>
    <button id="submitButton" class="btn btn-primary">Run</button>
    <div id="submitMessage"></div>

    <script id="parameters" type="application/json">
    {
        "datetime_01": {
            "label": "Date and Time Range",
            "type": "timestamp",
            "mode": "range"
        },
        "datetime_02": {
            "label": "Date Range",
            "type": "date",
            "mode": "range"
        },
        "datetime_03": {
            "label": "Time Range",
            "type": "time",
            "mode": "range"
        },
        "number_01": {
            "label": "Number Range",
            "type": "int",
            "mode": "range"
        },
        "number_02": {
            "label": "Percent Range",
            "type": "pct",
            "mode": "range"
        },
        "number_03": {
            "label": "Amount Range",
            "type": "amt",
            "mode": "range"
        },
        "combo_01": {
            "label": "Combo Box (Single)",
            "type": "combobox",
            "mode": "single",
            "data": [
                {"id": 1, "name": "Option 1"},
                {"id": 2, "name": "Option 2"}
            ],
            "value": "id",
            "display": "name"
        },
        "combo_02": {
            "label": "Combo Box (Multi)",
            "type": "combobox",
            "mode": "multi",
            "data": [
                {"id": 1, "name": "Option 1"},
                {"id": 2, "name": "Option 2"}
            ],
            "value": "id",
            "display": "name"
        },
        "check_01": {
            "label": "Check Box (Single)",
            "type": "checkbox",
            "mode": "single",
            "data": [
                {"id": 1, "name": "Option 1"},
                {"id": 2, "name": "Option 2"}
            ],
            "value": "id",
            "display": "name"
        },
        "check_02": {
            "label": "Check Box (Multi)",
            "type": "checkbox",
            "mode": "multi",
            "data": [
                {"id": 1, "name": "Option 1"},
                {"id": 2, "name": "Option 2"}
            ],
            "value": "id",
            "display": "name"
        }
    }
    </script>

    <script>
        function createFormGroup(key, parameter) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            // Create and append label element
            const labelElement = document.createElement('label');
            labelElement.textContent = parameter.label;
            if (parameter.required) {
                const asterisk = document.createElement('span');
                asterisk.textContent = '*';
                asterisk.className = 'required-asterisk';
                labelElement.appendChild(asterisk);
            }
            formGroup.appendChild(labelElement);

            // Create input/select/textarea element based on parameter type
            let inputElement;
            switch (parameter.type) {
                case 'date':
                    if (parameter.mode === 'range') {
                        formGroup.appendChild(createRangeDateInput(key));
                    } else {
                        inputElement = document.createElement('input');
                        inputElement.setAttribute('type', 'date');
                        inputElement.className = 'form-control';
                        inputElement.setAttribute('id', key); // Set id for input element
                        formGroup.appendChild(inputElement);
                    }
                    break;
                case 'time':
                    if (parameter.mode === 'range') {
                        formGroup.appendChild(createRangeTimeInput(key));
                    } else {
                        inputElement = document.createElement('input');
                        inputElement.setAttribute('type', 'time');
                        inputElement.className = 'form-control';
                        inputElement.setAttribute('id', key); // Set id for input element
                        formGroup.appendChild(inputElement);
                    }
                    break;
                case 'timestamp':
                    if (parameter.mode === 'range') {
                        formGroup.appendChild(createRangeTimestampInput(key));
                    } else {
                        inputElement = document.createElement('input');
                        inputElement.setAttribute('type', 'datetime-local');
                        inputElement.className = 'form-control';
                        inputElement.setAttribute('id', key); // Set id for input element
                        formGroup.appendChild(inputElement);
                    }
                    break;
                case 'int':
                case 'pct':
                case 'amt':
                    if (parameter.mode === 'range') {
                        formGroup.appendChild(createRangeInput(key, parameter));
                    } else {
                        inputElement = document.createElement('input');
                        inputElement.setAttribute('type', 'text');
                        inputElement.className = 'form-control';
                        inputElement.setAttribute('id', key); // Set id for input element
                        formGroup.appendChild(inputElement);
                    }
                    break;
                case 'combobox':
                    inputElement = createComboBox(key, parameter);
                    inputElement.setAttribute('id', key); // Set id for select element
                    formGroup.appendChild(inputElement);
                    break;
                case 'checkbox':
                    inputElement = createCheckBox(key, parameter);
                    formGroup.appendChild(inputElement);
                    break;
                default:
                    inputElement = document.createElement('input');
                    inputElement.setAttribute('type', 'text');
                    inputElement.className = 'form-control';
                    inputElement.setAttribute('id', key); // Set id for input element
                    formGroup.appendChild(inputElement);
            }

            // Create and append error message span
            const errorElement = document.createElement('span');
            errorElement.className = 'error';
            errorElement.setAttribute('id', key + '_error');
            formGroup.appendChild(errorElement);

            return formGroup;
        }

        function createRangeInput(key, parameter) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            const startInput = document.createElement('input');
            startInput.setAttribute('type', 'text');
            startInput.className = 'form-control';
            startInput.setAttribute('id', key + '_start');
            formGroup.appendChild(startInput);

            const toLabel = document.createElement('span');
            toLabel.className = 'range-divider';
            toLabel.textContent = ' to ';
            formGroup.appendChild(toLabel);

            const endInput = document.createElement('input');
            endInput.setAttribute('type', 'text');
            endInput.className = 'form-control';
            endInput.setAttribute('id', key + '_end');
            formGroup.appendChild(endInput);

            const errorElement = document.createElement('span');
            errorElement.className = 'error';
            errorElement.setAttribute('id', key + '_error');
            formGroup.appendChild(errorElement);

            return formGroup;
        }

        function createRangeTimestampInput(key) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            const startInput = document.createElement('input');
            startInput.setAttribute('type', 'datetime-local'); // Use datetime-local for timestamp
            startInput.className = 'form-control';
            startInput.setAttribute('id', key + '_start');
            formGroup.appendChild(startInput);

            const toLabel = document.createElement('span');
            toLabel.className = 'range-divider';
            toLabel.textContent = ' to ';
            formGroup.appendChild(toLabel);

            const endInput = document.createElement('input');
            endInput.setAttribute('type', 'datetime-local'); // Use datetime-local for timestamp
            endInput.className = 'form-control';
            endInput.setAttribute('id', key + '_end');
            formGroup.appendChild(endInput);

            const errorElement = document.createElement('span');
            errorElement.className = 'error';
            errorElement.setAttribute('id', key + '_error');
            formGroup.appendChild(errorElement);

            return formGroup;
        }

        function createRangeDateInput(key) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            const startInput = document.createElement('input');
            startInput.setAttribute('type', 'date');
            startInput.className = 'form-control';
            startInput.setAttribute('id', key + '_start');
            formGroup.appendChild(startInput);

            const toLabel = document.createElement('span');
            toLabel.className = 'range-divider';
            toLabel.textContent = ' to ';
            formGroup.appendChild(toLabel);

            const endInput = document.createElement('input');
            endInput.setAttribute('type', 'date');
            endInput.className = 'form-control';
            endInput.setAttribute('id', key + '_end');
            formGroup.appendChild(endInput);

            const errorElement = document.createElement('span');
            errorElement.className = 'error';
            errorElement.setAttribute('id', key + '_error');
            formGroup.appendChild(errorElement);

            return formGroup;
        }

        function createRangeTimeInput(key) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            const startInput = document.createElement('input');
            startInput.setAttribute('type', 'time');
            startInput.className = 'form-control';
            startInput.setAttribute('id', key + '_start');
            formGroup.appendChild(startInput);

            const toLabel = document.createElement('span');
            toLabel.className = 'range-divider';
            toLabel.textContent = ' to ';
            formGroup.appendChild(toLabel);

            const endInput = document.createElement('input');
            endInput.setAttribute('type', 'time');
            endInput.className = 'form-control';
            endInput.setAttribute('id', key + '_end');
            formGroup.appendChild(endInput);

            const errorElement = document.createElement('span');
            errorElement.className = 'error';
            errorElement.setAttribute('id', key + '_error');
            formGroup.appendChild(errorElement);

            return formGroup;
        }

        function createComboBox(key, parameter) {
            const selectElement = document.createElement('select');
            selectElement.className = 'form-control';
            selectElement.setAttribute('id', key);
            if (parameter.mode === 'multi') {
                selectElement.setAttribute('multiple', 'multiple');
            } else {
                const defaultOption = document.createElement('option');
                defaultOption.setAttribute('value', '');
                defaultOption.textContent = 'Select an Option';
                selectElement.appendChild(defaultOption);
            }

            parameter.data.forEach(option => {
                const optionElement = document.createElement('option');
                optionElement.setAttribute('value', option[parameter.value]);
                optionElement.textContent = option[parameter.display];
                selectElement.appendChild(optionElement);
            });

            return selectElement;
        }

        function createCheckBox(key, parameter) {
            const container = document.createElement('div');

            parameter.data.forEach((option, index) => {
                const checkboxId = key + '_' + index;

                const label = document.createElement('label');
                label.setAttribute('for', checkboxId);
                label.textContent = option[parameter.display];

                const checkbox = document.createElement('input');
                checkbox.setAttribute('type', 'checkbox');
                checkbox.setAttribute('id', checkboxId);
                checkbox.setAttribute('name', key);
                checkbox.setAttribute('value', option[parameter.value]);

                checkbox.addEventListener('change', () => {
                    if (parameter.mode === 'single') {
                        const checkboxes = document.querySelectorAll(`input[name='${key}']`);
                        checkboxes.forEach(cb => {
                            if (cb !== checkbox) {
                                cb.checked = false;
                            }
                        });
                    }
                });

                const checkboxContainer = document.createElement('div');
                checkboxContainer.className = 'checkbox-container';
                checkboxContainer.appendChild(label);
                checkboxContainer.appendChild(checkbox);

                container.appendChild(checkboxContainer);
            });

            return container;
        }

        function validateInput(value, type) {
            let regex;
            switch (type) {
                case 'int':
                    regex = /^\d+$/;
                    return regex.test(value) ? '' : 'Please enter a valid whole number.';
                case 'amt':
                    regex = /^\d+(\.\d{2})?$/;
                    return regex.test(value) ? '' : 'Please enter a valid amount (e.g., 123.45).';
                case 'pct':
                    regex = /^\d+(\.\d+)?%?$/;
                    return regex.test(value) ? '' : 'Please enter a valid percentage (e.g., 12.34%).';
                default:
                    return '';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const parameters = JSON.parse(document.getElementById('parameters').textContent);
            const parametersContainer = document.getElementById('parametersContainer');

            for (const [key, parameter] of Object.entries(parameters)) {
                const formGroup = createFormGroup(key, parameter);
                parametersContainer.appendChild(formGroup);
            }

            document.getElementById('submitButton').addEventListener('click', function (event) {
                event.preventDefault(); // Prevent default form submission behavior (if any)

                const formData = {};
                let formValid = true;

                for (const key of Object.keys(parameters)) {
                    const inputElement = document.getElementById(key);
                    if (inputElement) {
                        const value = inputElement.value;
                        if (parameters[key].type === 'int' || parameters[key].type === 'amt' || parameters[key].type === 'pct') {
                            const error = validateInput(value, parameters[key].type);
                            const errorElement = document.getElementById(key + '_error');
                            errorElement.textContent = error;
                            if (error) formValid = false;
                        }
                        formData[key] = value;
                    }

                    const startElement = document.getElementById(key + '_start');
                    const endElement = document.getElementById(key + '_end');
                    if (startElement && endElement) {
                        const startValue = startElement.value;
                        const endValue = endElement.value;

                        if (parameters[key].type === 'int' || parameters[key].type === 'amt' || parameters[key].type === 'pct') {
                            const startError = validateInput(startValue, parameters[key].type);
                            const endError = validateInput(endValue, parameters[key].type);
                            const errorElement = document.getElementById(key + '_error');
                            errorElement.textContent = startError || endError;
                            if (startError || endError) formValid = false;
                        }

                        formData[key] = {
                            start: startValue,
                            end: endValue
                        };
                    }
                }

                // Handle checkbox fields
                for (const key of Object.keys(parameters)) {
                    if (parameters[key].type === 'checkbox') {
                        const checkboxes = document.querySelectorAll(`input[name='${key}']:checked`);
                        formData[key] = Array.from(checkboxes).map(checkbox => checkbox.value);
                    }
                }

                if (formValid) {
                    console.log(formData); // Log formData to console
                    document.getElementById('submitMessage').textContent = 'Form Successfully Submitted!';
                } else {
                    document.getElementById('submitMessage').textContent = 'Please correct the errors and try again.';
                }

                // Clear the form after submission (optional)
                // parametersContainer.innerHTML = '';

                // Display the results in the #results div
                // document.getElementById('results').textContent = JSON.stringify(formData, null, 2);
            });
        });
    </script>
</body>
</html>
