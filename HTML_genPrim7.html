<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fb_title" content="HTML Generation Primitives 7">
    <title>Parameter HTML Generation</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .form-group label {
            width: 150px;
            margin-right: 10px;
        }
        .form-group .range-divider {
            margin: 0 5px;
        }
        .error {
            color: red;
            margin-left: 10px;
        }
        .required-asterisk {
            color: red;
            margin-left: 5px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .checkbox-container label {
            margin-bottom: 10px;
            width: auto;
            margin-right: 10px;
            display: block;
        }
        .checkbox-container input[type="checkbox"] {
            margin-left: 10px;
        }
        #submitMessage {
            color: green;
            margin-top: 10px;
        }
        .helper-text {
            font-size: 0.9em;
            margin-top: 5px;
            color: #6c757d; 
            white-space: nowrap;
            position: absolute; 
            display: inline-block;
            margin-top: 105px; 
            left: 155px; 
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div id="parametersContainer"></div>
    <button id="submitButton" class="btn btn-primary">Run</button>
    <div id="submitMessage"></div>

    <script id="parameters" type="application/json">
    {
        "datetime_01": {
            "label": "Date and Time Range",
            "type": "timestamp",
            "mode": "range"
        },
        "datetime_02": {
            "label": "Date Range",
            "type": "date",
            "mode": "range"
        },
        "datetime_03": {
            "label": "Time Range",
            "type": "time",
            "mode": "range"
        },
        "number_01": {
            "label": "Number Range",
            "type": "int",
            "mode": "range",
            "required": true
        },
        "number_02": {
            "label": "Percent Range",
            "type": "pct",
            "mode": "range",
            "required": true
        },
        "number_03": {
            "label": "Amount Range",
            "type": "amt",
            "mode": "range",
            "required": true
        },
        "combo_01": {
            "label": "Combo Box (Single)",
            "type": "combobox",
            "mode": "single",
            "data": [
                {"id": 1, "name": "Option 1"},
                {"id": 2, "name": "Option 2"}
            ],
            "value": "id",
            "display": "name"
        },
        "combo_02": {
            "label": "Combo Box (Multi)",
            "type": "combobox",
            "mode": "multi",
            "data": [
                {"id": 1, "name": "Option 1"},
                {"id": 2, "name": "Option 2"}
            ],
            "value": "id",
            "display": "name"
        },
        "check_01": {
            "label": "Check Box (Single)",
            "type": "checkbox",
            "mode": "single",
            "data": [
                {"id": 1, "name": "Option 1"},
                {"id": 2, "name": "Option 2"}
            ],
            "value": "id",
            "display": "name"
        },
        "check_02": {
            "label": "Check Box (Multi)",
            "type": "checkbox",
            "mode": "multi",
            "data": [
                {"id": 1, "name": "Option 1"},
                {"id": 2, "name": "Option 2"}
            ],
            "value": "id",
            "display": "name"
        }
    }
    </script>

    <script>
        function createFormGroup(key, parameter) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            // Create and append label element
            const labelElement = document.createElement('label');
            labelElement.textContent = parameter.label;
            if (parameter.required) {
                const asterisk = document.createElement('span');
                asterisk.textContent = '*';
                asterisk.className = 'required-asterisk';
                labelElement.appendChild(asterisk);
            }
            formGroup.appendChild(labelElement);

            // Create input/select/textarea element based on parameter type
            let inputElement;
            switch (parameter.type) {
                case 'date':
                    if (parameter.mode === 'range') {
                        formGroup.appendChild(createRangeDateInput(key));
                    } else {
                        inputElement = document.createElement('input');
                        inputElement.setAttribute('type', 'date');
                        inputElement.className = 'form-control';
                        inputElement.setAttribute('id', key); // Set id for input element
                        formGroup.appendChild(inputElement);
                    }
                    break;
                case 'time':
                    if (parameter.mode === 'range') {
                        formGroup.appendChild(createRangeTimeInput(key));
                    } else {
                        inputElement = document.createElement('input');
                        inputElement.setAttribute('type', 'time');
                        inputElement.className = 'form-control';
                        inputElement.setAttribute('id', key); // Set id for input element
                        formGroup.appendChild(inputElement);
                    }
                    break;
                case 'timestamp':
                    if (parameter.mode === 'range') {
                        formGroup.appendChild(createRangeTimestampInput(key));
                    } else {
                        inputElement = document.createElement('input');
                        inputElement.setAttribute('type', 'datetime-local');
                        inputElement.className = 'form-control';
                        inputElement.setAttribute('id', key); // Set id for input element
                        formGroup.appendChild(inputElement);
                    }
                    break;
                case 'int':
                case 'pct':
                case 'amt':
                    if (parameter.mode === 'range') {
                        formGroup.appendChild(createRangeInput(key, parameter));
                    } else {
                        inputElement = document.createElement('input');
                        inputElement.setAttribute('type', 'text');
                        inputElement.className = 'form-control';
                        inputElement.setAttribute('id', key); // Set id for input element
                        formGroup.appendChild(inputElement);
                    }
                    break;
                case 'combobox':
                    inputElement = createComboBox(key, parameter);
                    inputElement.setAttribute('id', key); // Set id for select element
                    formGroup.appendChild(inputElement);
                    if (parameter.mode === 'multi') {
                        const helperText = document.createElement('label');
                        helperText.textContent = 'Control-click to multi-select';
                        helperText.className = 'helper-text'; // class for styling 
                        formGroup.appendChild(helperText);
                    }
                    break;
                case 'checkbox':
                    inputElement = createCheckBox(key, parameter);
                    formGroup.appendChild(inputElement);
                    break;
                default:
                    inputElement = document.createElement('input');
                    inputElement.setAttribute('type', 'text');
                    inputElement.className = 'form-control';
                    inputElement.setAttribute('id', key); // Set id for input element
                    formGroup.appendChild(inputElement);
            }

            // Create and append error message span
            const errorElement = document.createElement('span');
            errorElement.className = 'error';
            errorElement.setAttribute('id', key + '_error');
            formGroup.appendChild(errorElement);

            return formGroup;
        }

        function createRangeInput(key, parameter) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            const startInput = document.createElement('input');
            startInput.setAttribute('type', 'text');
            startInput.className = 'form-control';
            startInput.setAttribute('id', key + '_start');
            formGroup.appendChild(startInput);

            const toLabel = document.createElement('span');
            toLabel.className = 'range-divider';
            toLabel.textContent = ' to ';
            formGroup.appendChild(toLabel);

            const endInput = document.createElement('input');
            endInput.setAttribute('type', 'text');
            endInput.className = 'form-control';
            endInput.setAttribute('id', key + '_end');
            formGroup.appendChild(endInput);

            const errorElement = document.createElement('span');
            errorElement.className = 'error';
            errorElement.setAttribute('id', key + '_error');
            formGroup.appendChild(errorElement);

            return formGroup;
        }

        function createRangeDateInput(key) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            const startInput = document.createElement('input');
            startInput.setAttribute('type', 'date');
            startInput.className = 'form-control';
            startInput.setAttribute('id', key + '_start');
            formGroup.appendChild(startInput);

            const toLabel = document.createElement('span');
            toLabel.className = 'range-divider';
            toLabel.textContent = ' to ';
            formGroup.appendChild(toLabel);

            const endInput = document.createElement('input');
            endInput.setAttribute('type', 'date');
            endInput.className = 'form-control';
            endInput.setAttribute('id', key + '_end');
            formGroup.appendChild(endInput);

            const errorElement = document.createElement('span');
            errorElement.className = 'error';
            errorElement.setAttribute('id', key + '_error');
            formGroup.appendChild(errorElement);

            return formGroup;
        }

        function createRangeTimeInput(key) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            const startInput = document.createElement('input');
            startInput.setAttribute('type', 'time');
            startInput.className = 'form-control';
            startInput.setAttribute('id', key + '_start');
            formGroup.appendChild(startInput);

            const toLabel = document.createElement('span');
            toLabel.className = 'range-divider';
            toLabel.textContent = ' to ';
            formGroup.appendChild(toLabel);

            const endInput = document.createElement('input');
            endInput.setAttribute('type', 'time');
            endInput.className = 'form-control';
            endInput.setAttribute('id', key + '_end');
            formGroup.appendChild(endInput);

            const errorElement = document.createElement('span');
            errorElement.className = 'error';
            errorElement.setAttribute('id', key + '_error');
            formGroup.appendChild(errorElement);

            return formGroup;
        }

        function createRangeTimestampInput(key) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            const startInput = document.createElement('input');
            startInput.setAttribute('type', 'datetime-local');
            startInput.className = 'form-control';
            startInput.setAttribute('id', key + '_start');
            formGroup.appendChild(startInput);

            const toLabel = document.createElement('span');
            toLabel.className = 'range-divider';
            toLabel.textContent = ' to ';
            formGroup.appendChild(toLabel);

            const endInput = document.createElement('input');
            endInput.setAttribute('type', 'datetime-local');
            endInput.className = 'form-control';
            endInput.setAttribute('id', key + '_end');
            formGroup.appendChild(endInput);

            const errorElement = document.createElement('span');
            errorElement.className = 'error';
            errorElement.setAttribute('id', key + '_error');
            formGroup.appendChild(errorElement);

            return formGroup;
        }

        function createComboBox(key, parameter) {
            const selectElement = document.createElement('select');
            selectElement.className = 'form-control';
            if (parameter.mode === 'multi') {
                selectElement.setAttribute('multiple', 'multiple');
            } else {
                const placeholderOption = document.createElement('option');
                placeholderOption.text = 'Select an Option';
                placeholderOption.value = '';
                selectElement.add(placeholderOption);
            }

            parameter.data.forEach(option => {
                const optionElement = document.createElement('option');
                optionElement.value = option[parameter.value];
                optionElement.text = option[parameter.display];
                selectElement.add(optionElement);
            });

            return selectElement;
        }

        function createCheckBox(key, parameter) {
            const checkboxContainer = document.createElement('div');
            checkboxContainer.className = 'checkbox-container';

            parameter.data.forEach(option => {
                const checkboxLabel = document.createElement('label');
                checkboxLabel.textContent = option[parameter.display];

                const checkboxElement = document.createElement('input');
                checkboxElement.setAttribute('type', 'checkbox');
                checkboxElement.setAttribute('name', key);
                checkboxElement.setAttribute('value', option[parameter.value]);

                if (parameter.mode === 'single') {
                    checkboxElement.addEventListener('change', (e) => {
                        document.querySelectorAll(`input[name=${key}]`).forEach(cb => {
                            if (cb !== e.target) cb.checked = false;
                        });
                    });
                }

                checkboxLabel.appendChild(checkboxElement);
                checkboxContainer.appendChild(checkboxLabel);
            });

            return checkboxContainer;
        }

        function isValidInput(element) {
            return element.value.trim() !== '';
        }

        function validateNumberRange(key, parameter) {
            const startInput = document.getElementById(key + '_start');
            const endInput = document.getElementById(key + '_end');
            const errorElement = document.getElementById(key + '_error');

            if (!isValidInput(startInput) || !isValidInput(endInput)) {
                errorElement.textContent = 'Both start and end values are required.';
                return false;
            }

            const startValue = parseFloat(startInput.value);
            const endValue = parseFloat(endInput.value);

            if (isNaN(startValue) || isNaN(endValue)) {
                errorElement.textContent = 'Both start and end values must be valid numbers.';
                return false;
            }

            if (parameter.type === 'pct' && (startValue < 0 || startValue > 100 || endValue < 0 || endValue > 100)) {
                errorElement.textContent = 'Values must be between 0 and 100 for percentage.';
                return false;
            }

            if (parameter.type === 'int' && (startValue < 0 || endValue < 0)) {
                errorElement.textContent = 'Values must be greater than 0.';
                return false;
            }

            if (startValue > endValue) {
                errorElement.textContent = 'Start value cannot be greater than end value.';
                return false;
            }

            errorElement.textContent = '';
            return true;
        }

        function validateForm(parameters) {
            let isValid = true;

            Object.keys(parameters).forEach(key => {
                const parameter = parameters[key];
                if (parameter.required) {
                    if (parameter.type === 'checkbox' && parameter.mode === 'multi') {
                        const checkboxes = document.querySelectorAll(`input[name=${key}]:checked`);
                        if (checkboxes.length === 0) {
                            document.getElementById(key + '_error').textContent = 'At least one option must be selected.';
                            isValid = false;
                        } else {
                            document.getElementById(key + '_error').textContent = '';
                        }
                    } else if (parameter.type === 'int' || parameter.type === 'pct' || parameter.type === 'amt') {
                        if (parameter.mode === 'range') {
                            if (!validateNumberRange(key, parameter)) {
                                isValid = false;
                            }
                        } else {
                            const element = document.getElementById(key);
                            if (element && !isValidInput(element)) {
                                document.getElementById(key + '_error').textContent = 'This field is required.';
                                isValid = false;
                            } else {
                                document.getElementById(key + '_error').textContent = '';
                            }
                        }
                    } else {
                        const element = document.getElementById(key);
                        if (element && !isValidInput(element)) {
                            document.getElementById(key + '_error').textContent = 'This field is required.';
                            isValid = false;
                        } else {
                            document.getElementById(key + '_error').textContent = '';
                        }
                    }
                }
            });

            return isValid;
        }

        function handleSubmit(parameters) {
            if (!validateForm(parameters)) {
                return;
            }

            const formData = {};
            const orderedFormData = {};

        // Collect form data
        Object.keys(parameters).forEach(key => {
            const parameter = parameters[key];

            if (parameter.type === 'checkbox' && parameter.mode === 'multi') {
                const value = Array.from(document.querySelectorAll(`input[name=${key}]:checked`)).map(cb => cb.value);
                formData[key] = value.join(','); // Join values into a comma-separated string
            } else if (parameter.type === 'checkbox' && parameter.mode === 'single') {
                const selectedCheckbox = document.querySelector(`input[name=${key}]:checked`);
                formData[key] = selectedCheckbox ? selectedCheckbox.value : null;
            } else if (parameter.type === 'combobox' && parameter.mode === 'multi') {
                const value = Array.from(document.getElementById(key).selectedOptions).map(option => option.value);
                formData[key] = value.join(','); // Join values into a comma-separated string
            } else if (parameter.type === 'combobox' && parameter.mode === 'single') {
                formData[key] = document.getElementById(key).value;
            } else if (parameter.type === 'date' && parameter.mode === 'range') {
                formData[key + '_start'] = document.getElementById(key + '_start').value;
                formData[key + '_end'] = document.getElementById(key + '_end').value;
            } else if (parameter.type === 'time' && parameter.mode === 'range') {
                formData[key + '_start'] = document.getElementById(key + '_start').value;
                formData[key + '_end'] = document.getElementById(key + '_end').value;
            } else if (parameter.type === 'timestamp' && parameter.mode === 'range') {
                formData[key + '_start'] = document.getElementById(key + '_start').value;
                formData[key + '_end'] = document.getElementById(key + '_end').value;
            } else if ((parameter.type === 'int' || parameter.type === 'pct' || parameter.type === 'amt') && parameter.mode === 'range') {
                formData[key + '_start'] = document.getElementById(key + '_start').value;
                formData[key + '_end'] = document.getElementById(key + '_end').value;
            } else {
                formData[key] = document.getElementById(key).value;
            }
        });

        // Order formData to ensure _start fields come before _end fields
        Object.keys(formData).sort((a, b) => {
            // Custom sorting logic to ensure _start keys come before _end keys
            if (a.endsWith('_start') && b.endsWith('_end')) return -1;
            if (a.endsWith('_end') && b.endsWith('_start')) return 1;
            return a.localeCompare(b); // Default alphanumeric sorting for other keys
        }) 
            .forEach(key => {
            orderedFormData[key] = formData[key];
        });

    console.log('Form Data:', orderedFormData);
    document.getElementById('submitMessage').textContent = 'Form submitted successfully!';
}
        document.addEventListener('DOMContentLoaded', function () {
            const parameters = JSON.parse(document.getElementById('parameters').textContent);
            const parametersContainer = document.getElementById('parametersContainer');

            Object.keys(parameters).forEach(key => {
                const formGroup = createFormGroup(key, parameters[key]);
                parametersContainer.appendChild(formGroup);
            });

            document.getElementById('submitButton').addEventListener('click', function () {
                handleSubmit(parameters);
            });
        });
    </script>
</body>
</html>
