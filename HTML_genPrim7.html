<body>

    <script id="parameters" type="application/json">
    {

        "datetime_02": {

        "datetime_03": {

        "number_01": {

        },

        },

    <script>
        // Updated createFormGroup function
function createFormGroup(key, parameter) {
    const formGroup = document.createElement('div');
    formGroup.className = 'form-group';

    const labelElement = document.createElement('label');
    labelElement.setAttribute('for', key);
    labelElement.textContent = parameter.label;
    if (parameter.required === undefined) {
        parameter.required = false; // Set default value to false if not specified
    }
    if (parameter.required) {
        const asterisk = document.createElement('span');
        asterisk.textContent = '*';
        asterisk.className = 'required-asterisk';
        labelElement.appendChild(asterisk);
    }
    formGroup.appendChild(labelElement);

    let inputElement;
    switch (parameter.type) {
        case 'date':
        case 'time':
        case 'timestamp':
            if (parameter.mode === 'range') {
                formGroup.appendChild(createRangeInput(key, parameter));
            } else {
                inputElement = document.createElement('input');
                inputElement.setAttribute('type', parameter.type);
                inputElement.className = 'form-control';
                inputElement.setAttribute('id', key);
                formGroup.appendChild(inputElement);
            }
            break;
        case 'int':
        case 'pct':
        case 'amt':
            if (parameter.mode === 'range') {
                formGroup.appendChild(createRangeInput(key, parameter));
            } else {
                inputElement = document.createElement('input');
                inputElement.setAttribute('type', 'text');
                inputElement.className = 'form-control';
                inputElement.setAttribute('id', key);
                formGroup.appendChild(inputElement);
            }
            break;
        case 'combobox':
            inputElement = createComboBox(key, parameter);
            formGroup.appendChild(inputElement);
            break;
        case 'checkbox':
            inputElement = createCheckBox(key, parameter);
            formGroup.appendChild(inputElement);
            break;
        default:
            inputElement = document.createElement('input');
            inputElement.setAttribute('type', 'text');
            inputElement.className = 'form-control';
            inputElement.setAttribute('id', key);
            formGroup.appendChild(inputElement);
    }

    const errorElement = document.createElement('span');
    errorElement.className = 'error';
    errorElement.setAttribute('id', key + '_error');
    formGroup.appendChild(errorElement);

    return formGroup;
}

// Updated createRangeInput function (remove label creation)
function createRangeInput(key, parameter) {
    const formGroup = document.createElement('div');
    formGroup.className = 'form-group';

    const startInput = document.createElement('input');
    startInput.setAttribute('type', parameter.type);
    startInput.className = 'form-control';
    startInput.setAttribute('id', key + '_start');
    formGroup.appendChild(startInput);

    const toLabel = document.createElement('span');
    toLabel.className = 'range-divider';
    toLabel.textContent = ' to ';
    formGroup.appendChild(toLabel);

    const endInput = document.createElement('input');
    endInput.setAttribute('type', parameter.type);
    endInput.className = 'form-control';
    endInput.setAttribute('id', key + '_end');
    formGroup.appendChild(endInput);

    const errorElement = document.createElement('span');
    errorElement.className = 'error';
    errorElement.setAttribute('id', key + '_error');
    formGroup.appendChild(errorElement);

    return formGroup;
}
        // Function to create combobox (single or multi)
        function createComboBox(key, parameter) {
            const selectElement = document.createElement('select');
            selectElement.className = 'form-control';
            selectElement.setAttribute('id', key);

            if (parameter.mode === 'multi') {
                selectElement.setAttribute('multiple', true);
            }

            parameter.data.forEach(option => {
                const optionElement = document.createElement('option');
                optionElement.setAttribute('value', option[parameter.value]);
                optionElement.textContent = option[parameter.display];
                selectElement.appendChild(optionElement);
            });

            return selectElement;
        }

        // Function to create checkbox (single or multi)
        function createCheckBox(key, parameter) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            const outerLabel = document.createElement('label');
            outerLabel.textContent = parameter.label;
            formGroup.appendChild(outerLabel);

            const checkboxContainer = document.createElement('div');

            parameter.data.forEach(option => {
            const checkboxLabel = document.createElement('label');
            checkboxLabel.className = 'form-check-label';

            const checkbox = document.createElement('input');
            checkbox.setAttribute('type', 'checkbox');
            checkbox.className = 'form-check-input';
            checkbox.setAttribute('value', option[parameter.value]);
            checkbox.setAttribute('id', `${key}_${option[parameter.value]}`);

            checkboxLabel.appendChild(checkbox);
            checkboxLabel.appendChild(document.createTextNode(option[parameter.display]));
            checkboxContainer.appendChild(checkboxLabel);
    });

        formGroup.appendChild(checkboxContainer);

        const errorElement = document.createElement('span');
        errorElement.className = 'error';
        errorElement.setAttribute('id', key + '_error');
        formGroup.appendChild(errorElement);

        return formGroup;
    }


        // Function to generate HTML form elements based on parameter JSON
        function generateFormElements() {
            const parameters = JSON.parse(document.getElementById('parameters').textContent);
            const parametersContainer = document.getElementById('parametersContainer');

            Object.keys(parameters).forEach(key => {
                const parameter = parameters[key];
                const formGroup = createFormGroup(key, parameter);
                parametersContainer.appendChild(formGroup);
            });
        }

        // Function to handle form submission
        function handleSubmit() {
            const parameters = JSON.parse(document.getElementById('parameters').textContent);
            const query = document.getElementById('query').textContent;

            const formData = {};
            let error = false;

            Object.keys(parameters).forEach(key => {
                const parameter = parameters[key];
                const value = getValue(key, parameter);

                // Check if required and validate
                if (parameter.required && !value) {
                    document.getElementById(key + '_error').textContent = 'This field is required';
                    error = true;
                } else {
                    formData[key] = value;
                    document.getElementById(key + '_error').textContent = '';
                }
            });

            if (!error) {
                // Process form data (e.g., submit via AJAX, generate query)
                console.log('Form data:', formData);
                console.log('Query:', query);
                // Here you can add code to submit the form data or perform further actions
                // For example, sending formData and query to a backend API
            }
        }

        // Function to get value from form element based on type and mode
        function getValue(key, parameter) {
            let value;
            switch (parameter.type) {
                case 'date':
                case 'time':
                case 'timestamp':
                    if (parameter.mode === 'range') {
                        const startValue = document.getElementById(key + '_start').value;
                        const endValue = document.getElementById(key + '_end').value;
                        value = { start: startValue, end: endValue };
                    } else {
                        value = document.getElementById(key).value;
                    }
                    break;
                case 'int':
                case 'pct':
                case 'amt':
                    if (parameter.mode === 'range') {
                        const startValue = document.getElementById(key + '_start').value;
                        const endValue = document.getElementById(key + '_end').value;
                        value = { start: startValue, end: endValue };
                    } else {
                        value = document.getElementById(key).value;
                    }
                    break;
                case 'combobox':
                    const selectElement = document.getElementById(key);
                    if (parameter.mode === 'single') {
                        value = selectElement.value;
                    } else {
                        value = Array.from(selectElement.selectedOptions).map(option => option.value);
                    }
                    break;
                case 'checkbox':
                    const checkboxes = document.querySelectorAll(`#${key} input[type="checkbox"]:checked`);
                    if (parameter.mode === 'single') {
                        value = checkboxes.length > 0 ? checkboxes[0].value : '';
                    } else {
                        value = Array.from(checkboxes).map(checkbox => checkbox.value);
                    }
                    break;
                default:
                    value = document.getElementById(key).value;
            }
            return value;
        }

        // Event listener for form submission
        document.getElementById('submitButton').addEventListener('click', handleSubmit);

        // Generate form elements on page load
        generateFormElements();
    </script>
