<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Generation Demo</title>
    <!-- Include jQuery and DataTables -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
</head>
<body>
    <div id="results"></div>

    <script id="columns" type="application/json">
    {
        "so_num": { "format": "text" },
        "so_date_issued": { "format": "date" },
        "customer_name": { "format": "text" },
        "line_type": { "format": "text" },
        "line_number": { "format": "text" },
        "product_num": { "format": "text" },
        "product_description": { "format": "text" },
        "shipped_qty": { "format": "number" },
        "total_revenue": { "format": "currency" },
        "line_unit_cost": { "format": "currency" },
        "total_cogs": { "format": "currency" }
    }
    </script>

    <script>
    $(document).ready(function() {
        // Sample data 
        var resultsData = [
            { so_num: '123', so_date_issued: '2024-05-15', customer_name: 'name1', line_type: 'Type A', line_number: '1', product_num: 'P001', product_description: 'Product A', shipped_qty: 100, total_revenue: 500.00, line_unit_cost: 200.00, total_cogs: 150.00 },
            { so_num: '124', so_date_issued: '2024-05-16', customer_name: 'name2', line_type: 'Type B', line_number: '2', product_num: 'P002', product_description: 'Product B', shipped_qty: 150, total_revenue: 750.00, line_unit_cost: 300.00, total_cogs: 200.00 }
        ];

        // Retrieve columns configuration
        var columnsConfig = JSON.parse($('#columns').text());

        // Generate DataTable and render it in the specified element
        generateDataTable(resultsData, columnsConfig, '#results');
    });

    // Function to generate a DataTable from JSON data and column settings
    function generateDataTable(data, columnsConfig, targetElement) {
        return $(targetElement).DataTable({
            data: data,
            columns: Object.keys(columnsConfig).map(function(column) {
                return { data: column, title: column.replace(/_/g, ' ').toUpperCase() };
            }),
            columnDefs: Object.keys(columnsConfig).map(function(column) {
                return {
                    targets: column,
                    render: function(data, type, row) {
                        return renderColumnData(data, columnsConfig[column].format);
                    }
                };
            })
        });
    }

    // Function to render column data based on specified format
    function renderColumnData(data, format) {
        switch (format) {
            case 'date':
                return new Date(data).toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
            case 'currency':
                return '$' + parseFloat(data).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,');
            default:
                return data;
        }
    }
    </script>
</body>
</html>
