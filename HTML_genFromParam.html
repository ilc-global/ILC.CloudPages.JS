<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parameter HTML Generation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 15px;
            background-color: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="parametersContainer"></div>
    <button onclick="submitForm()">Submit</button>

    <script id="parameters" type="application/json">
    {
        "child_customers" : {
            "type" : "multiselect",
            "sql" : "select id,name from customer where customer.parentid = 100"
            "value" : "id",
            "display" : "name"
        },
        "customer" : {
            "type" : "customer",
            "mode" : "single", // single, multi
            "default" : "%", // default option
        },
        "date_issued": {
            "label": "Date Issued",
            "type" : "date",
            "mode" : "range", // range, before, after
            "valuetype" : "timestamp", // timestamp, date
            "range_default" : "today", // today, this week, last week, all relative dates
        }
    }
    </script>

    <script>
    // Function to generate HTML form elements based on parameter JSON
    function generateParameterForm() {
        var parameters = JSON.parse(document.getElementById('parameters').textContent);
        var container = document.getElementById('parametersContainer');

        Object.keys(parameters).forEach(function(key) {
            var parameter = parameters[key];
            var element;

            if (parameter.type === 'text') {
                element = document.createElement('input');
                element.setAttribute('type', 'text');
                element.setAttribute('name', key);
                element.setAttribute('placeholder', parameter.placeholder || '');
                element.required = parameter.required;
            } else if (parameter.type === 'select') {
                element = document.createElement('select');
                element.setAttribute('name', key);
                element.required = parameter.required;

                parameter.options.forEach(function(option) {
                    var optionElem = document.createElement('option');
                    optionElem.setAttribute('value', option.value);
                    optionElem.textContent = option.label;
                    element.appendChild(optionElem);
                });
            }

            var label = document.createElement('label');
            label.textContent = parameter.label;
            container.appendChild(label);
            container.appendChild(element);
        });
    }

    // Function to handle form submission (unsure if needed)
    function submitForm() {
        var form = document.createElement('form');
        form.appendChild(document.createTextNode('Form submitted successfully!'));
        document.body.appendChild(form);

        setTimeout(function() {
            form.remove();
        }, 3000);
    }

    // Generate form elements on page load
    document.addEventListener('DOMContentLoaded', function() {
        generateParameterForm();
    });
    </script>
</body>
</html>
